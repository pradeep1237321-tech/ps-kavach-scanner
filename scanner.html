<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Kavach — Fast Attendance Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--brand:#b12b36;--brand-d:#861f28;--gold:#d0a050;--ink:#20202a;--ink2:#5a5a66;--line:#e7e1d8;--bg:#f4f1ec;--ok:#1f7a45;--bad:#c0392b;}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
.top{background:linear-gradient(90deg,var(--brand-d),var(--brand));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.top b{font-size:15px}.top .who{margin-left:auto;font-size:12px;opacity:.9;text-align:right}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfaf8;outline:none;font-size:15px}
input:focus,select:focus{border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.btn:hover{background:var(--brand-d)}.btn.soft{background:#efe9e1;border-color:var(--line);color:var(--ink)}.btn.wide{width:100%}
.btn.sm{padding:8px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#stage{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;display:grid;place-items:center}
@media(min-width:560px){#stage{aspect-ratio:4/3}}
#vid{width:100%;height:100%;object-fit:cover;display:none}
#idle{color:#fff;opacity:.85;text-align:center;font-size:13px}
#reticle{position:absolute;inset:18% 16%;border:3px solid var(--gold);border-radius:16px;display:none;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
#laser{position:absolute;left:16%;right:16%;height:3px;background:var(--gold);box-shadow:0 0 12px var(--gold);display:none;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:20%}50%{top:78%}}
#flash{position:absolute;inset:0;background:var(--ok);opacity:0;pointer-events:none;transition:opacity .12s}
.big{font-size:30px;font-weight:800;text-align:center;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;background:#efe9e1;color:var(--ink2)}
.chip.ok{background:#e7f5ec;color:var(--ok)}
.mk{display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-bottom:1px solid #f1ece5}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#efe9e1;color:var(--ink2)}
.pill.ok{background:#e7f5ec;color:var(--ok)}.pill.bad{background:#fdeaea;color:var(--bad)}
.empty{text-align:center;color:var(--ink2);padding:16px;font-size:13px}
.msg{font-size:12.5px;color:var(--bad);min-height:16px;margin-top:6px}
.note{background:#fff8ec;border:1px solid #f0dcae;border-radius:10px;padding:10px 12px;font-size:12px;color:#6d5220}
.demo{position:fixed;left:12px;bottom:12px;background:#23232e;color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;opacity:.85;z-index:50;display:none}
#toast{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#23232e;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:600}
.toast.ok{background:#177245}.toast.bad{background:#b3323b}.toast.warn{background:#a5701a}
</style>
</head>
<body>
<div class="top"><b>PS Kavach — Attendance</b><div class="who" id="who"></div></div>
<div class="wrap">

  <!-- PIN -->
  <div class="card" id="pinCard">
    <label class="fl">Invigilator name</label><input type="text" id="invig" autocomplete="name" placeholder="Faculty / Invigilator name"><div style="height:10px"></div><label class="fl">Attendance PIN</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" placeholder="Enter the PIN set by admin" onkeydown="if(event.key==='Enter')signIn()">
    <div class="msg" id="pinMsg"></div>
    <button class="btn wide" id="signBtn" style="margin-top:10px" onclick="signIn()">Sign in ▸</button>
    <div class="note" style="margin-top:12px">The PIN is set in Admin (Config → ScanPIN). This scanner runs on your phone/laptop camera and marks attendance instantly.</div>
  </div>

  <!-- SCANNER -->
  <div class="card" id="scanCard" style="display:none">
    <label class="fl">Marking attendance for</label>
    <select id="testSel"></select>
    <div id="stage" style="margin-top:12px">
      <video id="vid" playsinline muted></video><canvas id="cv" style="display:none"></canvas>
      <div id="idle">Camera off<br><span style="font-size:11px">Press Start</span></div>
      <div id="reticle"></div><div id="laser"></div><div id="flash"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="startBtn" onclick="toggleScan()">▶ Start scanning</button>
      <button class="btn soft" id="torchBtn" onclick="toggleTorch()" style="display:none">🔦 Torch</button>
      <span class="chip" id="engine">Engine: —</span>
    </div>
    <div id="lastHit" style="display:none;margin-top:12px;padding:12px;border-radius:12px;background:#e7f5ec;text-align:center">
      <div class="big" id="hitName" style="color:var(--ok)"></div>
      <div class="pill ok" id="hitInfo"></div>
    </div>
  </div>

  <!-- LIST -->
  <div class="card" id="listCard" style="display:none">
    <div class="row" style="justify-content:space-between"><b>Marked this session</b><span class="pill ok" id="count">0</span></div>
    <div id="list" style="max-height:340px;overflow:auto;margin-top:6px"><div class="empty">Scans appear here instantly.</div></div>
    <div class="row" style="margin-top:8px"><button class="btn soft sm" onclick="manual()">＋ Manual (type ERP)</button><button class="btn soft sm" onclick="exportCsv()">⬇ Export</button></div>
  </div>
</div>
<div class="demo" id="demo">DEMO — set your backend URL</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
/* ===== backend (paste your Apps Script /exec URL, or open with ?backend=...) ===== */
var BACKEND = 'https://script.google.com/macros/s/AKfycbzbilP2l7myjO5M8TuKyEwiuRA4oeqNXgYCW5eOYgJj_GlzgNqButOLsKZN4IVKuw5L/exec';
(function(){ var q=new URLSearchParams(location.search); if(q.get('backend')) BACKEND=q.get('backend'); })();
var DEMO = (BACKEND.indexOf('http')!==0);
if(DEMO) document.getElementById('demo').style.display='block';

var cbN=0;
function apiOnce(params,timeoutMs){ return new Promise(function(res,rej){
  if(DEMO){ return rej(new Error('demo')); }
  var cb='scb_'+Date.now()+'_'+(cbN++); var t=setTimeout(function(){clean();rej(new Error('timeout'));},timeoutMs||25000);
  window[cb]=function(d){clearTimeout(t);clean();res(d);};
  function clean(){try{delete window[cb];}catch(e){}if(s&&s.parentNode)s.parentNode.removeChild(s);}
  var url=BACKEND+(BACKEND.indexOf('?')<0?'?':'&')+'callback='+cb+'&_='+Date.now();
  Object.keys(params).forEach(function(k){url+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);});
  var s=document.createElement('script'); s.src=url; s.onerror=function(){clearTimeout(t);clean();rej(new Error('network'));};
  document.head.appendChild(s);
});}
function api(params){ return apiOnce(params,25000).catch(function(){return apiOnce(params,35000);}); }

function $(id){return document.getElementById(id);}
function toast(m,t){var d=document.createElement('div');d.className='toast'+(t?' '+t:'');d.textContent=m;$('toast').appendChild(d);setTimeout(function(){d.remove();},2400);}

var PIN='', INVIG='', marks=[];
function signIn(){
  INVIG=$('invig').value.trim()||'Invigilator'; PIN=$('pin').value.trim(); if(!PIN){$('pinMsg').textContent='Enter the attendance PIN.';return;}
  var sb=$('signBtn'); function ready(){sb.disabled=false;sb.textContent='Sign in ▸';}
  $('pinMsg').textContent='Connecting securely…'; $('pinMsg').style.color='var(--ink2)';sb.disabled=true;sb.textContent='Connecting…';
  if(DEMO){ready();startScannerUI([{id:'MASTER',title:'Master (all scanner-open tests)'}]);return;}
  api({api:'scanContext',pin:PIN}).then(function(r){
    if(!r||!r.ok){ready();var reason=(r&&r.reason)||'pin';var message=(reason==='pin'||reason==='missing-pin')?'Incorrect attendance PIN.':reason==='not-configured'?'Attendance PIN is not configured in Admin.':((r&&r.msg)||'Scanner service is temporarily unavailable. Please retry.');$('pinMsg').style.color='var(--bad)';$('pinMsg').textContent=message;return;}
    $('pinMsg').textContent='';
    var tests=[{id:'MASTER',title:'Master — all scanner-open tests'}].concat((r.liveTests||[]).map(function(t){return {id:t.id,title:t.title};}));
    startScannerUI(tests);
  }).catch(function(){ready();$('pinMsg').style.color='var(--bad)';$('pinMsg').textContent='Server did not respond after two attempts. Check internet and retry.';});
}

function startScannerUI(tests){
  $('who').textContent=INVIG;
  $('pinCard').style.display='none';$('scanCard').style.display='block';$('listCard').style.display='block';
  $('testSel').innerHTML=tests.map(function(t){return '<option value="'+t.id+'">'+t.title+'</option>';}).join('');
}

/* ===== FAST scan engine (native BarcodeDetector + jsQR fallback) ===== */
var stream=null,raf=null,detector=null,track=null,torchOn=false,last='',lastT=0,lastFrame=0;
async function toggleScan(){ if(stream){stopScan();return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
    var v=$('vid'); v.srcObject=stream; await v.play(); v.style.display='block'; $('idle').style.display='none';
    $('reticle').style.display='block'; $('laser').style.display='block';
    track=stream.getVideoTracks()[0];
    if(track.getCapabilities&&track.getCapabilities().torch)$('torchBtn').style.display='inline-flex';
    if('BarcodeDetector'in window){ detector=new BarcodeDetector({formats:['qr_code']}); $('engine').textContent='Engine: Native (fast)'; $('engine').className='chip ok'; }
    else { detector=null; $('engine').textContent='Engine: jsQR'; }
    $('startBtn').textContent='⏹ Stop'; loop(); toast('Scanner live','ok');
  }catch(e){ toast('Camera error: '+e.message,'bad'); stream=null; }
}
function stopScan(){ if(raf)cancelAnimationFrame(raf); if(stream)stream.getTracks().forEach(function(t){t.stop();}); stream=null;detector=null;
  $('vid').style.display='none';$('idle').style.display='block';$('reticle').style.display='none';$('laser').style.display='none';$('torchBtn').style.display='none';$('startBtn').textContent='▶ Start scanning'; }
async function loop(){
  var v=$('vid'); var now=performance.now();
  if(now-lastFrame>=60){ lastFrame=now;   // ~16 fps analysis — snappy, low CPU
    try{ var code=null;
      if(detector){ var c=await detector.detect(v); if(c.length)code=c[0].rawValue; }
      else { var cv=$('cv'); cv.width=v.videoWidth; cv.height=v.videoHeight; var ctx=cv.getContext('2d'); ctx.drawImage(v,0,0,cv.width,cv.height);
        var img=ctx.getImageData(0,0,cv.width,cv.height); var r=window.jsQR&&jsQR(img.data,img.width,img.height); if(r)code=r.data; }
      if(code)hit(code);
    }catch(e){}
  }
  if(stream)raf=requestAnimationFrame(loop);
}
function hit(code){ var now=Date.now(); var erp=(String(code).split('|')[0]||code).trim();
  if(erp===last && now-lastT<2500) return;   // duplicate guard
  last=erp; lastT=now; mark(erp); }

function mark(raw){
  var erp=String(raw).trim().toUpperCase();
  if(marks.some(function(m){return m.erp===erp && m.ok;})){ toast(erp+' already marked','warn'); return; }
  var testId=$('testSel').value;
  if(DEMO){ beep();if(navigator.vibrate)navigator.vibrate(60);flash();addMark(erp,'Demo Student',true,'demo'); return; }
  api({api:'scanMark',pin:PIN,testId:testId,erp:erp,name:INVIG}).then(function(r){
    if(r&&r.ok){ beep();if(navigator.vibrate)navigator.vibrate(60);flash();addMark(erp,r.name||erp,true,(r.marked||0)+' test(s)'); showHit(r.name||erp,(r.spec||'')+' · '+(r.marked||0)+' marked'); }
    else { addMark(erp,(r&&r.name)||erp,false,(r&&r.msg)||'rejected'); toast((r&&r.msg)||'Rejected','bad'); }
  }).catch(function(){ addMark(erp,erp,false,'network'); toast('Network error','bad'); });
}
function addMark(erp,name,ok,info){ marks.unshift({erp:erp,name:name,ok:ok,info:info,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}); render(); }
function render(){ $('count').textContent=marks.filter(function(m){return m.ok;}).length;
  $('list').innerHTML=marks.length?marks.map(function(m){return '<div class="mk"><div><b>'+m.erp+'</b> <span style="color:var(--ink2)">'+m.name+'</span></div><div><span style="color:var(--ink2);font-size:12px">'+m.time+'</span> <span class="pill '+(m.ok?'ok':'bad')+'">'+(m.ok?'✓':m.info)+'</span></div></div>';}).join(''):'<div class="empty">Scans appear here instantly.</div>'; }
function showHit(name,info){ $('lastHit').style.display='block'; $('hitName').textContent=name; $('hitInfo').textContent=info; }
function manual(){ var e=prompt('Type the ERP to mark present:'); if(e)mark(e.trim()); }
function exportCsv(){ if(!marks.length)return toast('Nothing to export','bad'); var csv='ERP,Name,OK,Info,Time\n'+marks.map(function(m){return m.erp+','+m.name+','+m.ok+','+m.info+','+m.time;}).join('\n');
  var b=new Blob([csv],{type:'text/csv'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='attendance_'+Date.now()+'.csv'; a.click(); }
async function toggleTorch(){ if(!track)return; try{ torchOn=!torchOn; await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ toast('Torch not supported','bad'); } }
function flash(){ var f=$('flash'); f.style.opacity=.6; setTimeout(function(){f.style.opacity=0;},130); }
var actx; function beep(){ try{ actx=actx||new(window.AudioContext||webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.connect(g); g.connect(actx.destination); o.frequency.value=1040; g.gain.value=.06; o.start(); setTimeout(function(){o.stop();},70); }catch(e){} }
</script>
</body>
</html>
